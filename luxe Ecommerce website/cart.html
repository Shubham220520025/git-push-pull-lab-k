<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart - Luxe</title>
  <link rel="stylesheet" href="index.html" /> <!-- Optional if separating styles -->
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: linear-gradient(45deg, #0a0a0a, #1a1a2e, #16213e, #0f0f23);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      background: rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(20px);
      padding: 1rem 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
      font-size: 2rem;
      font-weight: bold;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .cart-container {
      max-width: 900px;
      margin: 5rem auto;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .cart-title {
      font-size: 2.5rem;
      margin-bottom: 2rem;
      background: linear-gradient(45deg, #ffffff, #4ecdc4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item-name {
      font-size: 1.2rem;
    }

    .cart-item-price {
      color: #4ecdc4;
      font-weight: bold;
    }

    .checkout-btn {
      display: block;
      margin: 2rem auto 0;
      padding: 1rem 2rem;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .checkout-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
    }
  </style>
</head>
<body>
  <div class="bg-animation"></div>

  <header>
    <div class="logo">LUXE</div>
  </header>

  <div class="cart-container">
    <h1 class="cart-title">Your Shopping Cart</h1>
    <div id="cart-items">
      <!-- Cart items will be dynamically injected here -->
    </div>
    <button class="checkout-btn">Proceed to Checkout</button>
  </div>

  
   <script>
  function renderCartItems() {
    const container = document.getElementById('cart-items');
    const cartItems = JSON.parse(localStorage.getItem('luxeCart')) || [];

    if (cartItems.length === 0) {
      container.innerHTML = '<p>Your cart is empty.</p>';
      return;
    }

    container.innerHTML = '';
    cartItems.forEach(item => {
      const div = document.createElement('div');
      div.className = 'cart-item';
      div.innerHTML = `
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-price">${item.price}</div>
      `;
      container.appendChild(div);
    });
  }

  // Call on page load
  renderCartItems();

  // Checkout button handler
  document.querySelector('.checkout-btn').addEventListener('click', () => {
    const cartItems = JSON.parse(localStorage.getItem('luxeCart')) || [];

    if (cartItems.length === 0) {
      alert("🛒 Your cart is already empty.");
      return;
    }

    alert("✅ Order placed successfully!");

    // Clear cart and refresh UI
    localStorage.removeItem('luxeCart');
    renderCartItems();
  });
</script>

  
</body>
</html>
